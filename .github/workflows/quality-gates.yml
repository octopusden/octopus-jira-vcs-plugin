name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The analysers read the repository and nothing else.
permissions:
  contents: read

jobs:
  quality:
    # Compile and release use JDK 8, which never activates octopus-parent's quality
    # profile. This JDK 11 job exists solely to run the inherited gates; its artifacts
    # are discarded.
    uses: octopusden/octopus-base/.github/workflows/common-java-maven-build.yml@v3.0.3
    with:
      java-version: '11'
